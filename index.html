<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos</title>

 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <main class="container my-5">
    
    <div class="row g-4 text-center">

      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card shadow-sm p-3">
          <div class="card-body">
            <h5 class="card-title fw-bold text-uppercase">Mouse RGB</h5>
            <h4 class="text-success fw-bold my-3">$45.00</h4>
            <button class="btn btn-outline-secondary w-100">Comprar</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card shadow-sm p-3">
          <div class="card-body">
            <h5 class="card-title fw-bold text-uppercase">Teclado Meca</h5>
            <h4 class="text-success fw-bold my-3">$85.00</h4>
            <button class="btn btn-outline-secondary w-100">Comprar</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card shadow-sm p-3">
          <div class="card-body">
            <h5 class="card-title fw-bold text-uppercase">Headset 7.1</h5>
            <h4 class="text-success fw-bold my-3">$60.00</h4>
            <button class="btn btn-outline-secondary w-100">Comprar</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card shadow-sm p-3">
          <div class="card-body">
            <h5 class="card-title fw-bold text-uppercase">Silla Gamer</h5>
            <h4 class="text-success fw-bold my-3">$199.00</h4>
            <button class="btn btn-outline-secondary w-100">Comprar</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
